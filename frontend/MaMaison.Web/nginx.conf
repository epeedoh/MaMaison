server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy vers l'API .NET 10
    location /api/ {
        proxy_pass         http://${API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /swagger/ {
        proxy_pass         http://${API_UPSTREAM}/swagger/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /site-config.json {
        proxy_pass http://${API_UPSTREAM}/api/site-config;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /uploads/ {
        if ($uri !~* \.(jpg|jpeg|png|webp|mp4|webm|mov)$) { return 404; }
        proxy_pass http://${API_UPSTREAM}/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location ^~ /viewer-3d/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        location ~ \.mjs$ {
            types { application/javascript mjs; }
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
    }

    location = /release.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /ngsw.json { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long terme pour les assets hachés
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pas de cache pour index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
