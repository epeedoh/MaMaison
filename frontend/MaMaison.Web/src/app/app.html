<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/" class="brand">
      <div class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="7" fill="#0F1F3D"/>
          <path d="M14 6L4 13h3v9h6v-5h2v5h6V13h3L14 6z" fill="#C8972A"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">MaMaison</span>
        <span class="brand-tag">VERIFIED</span>
      </div>
    </a>

    <div class="navbar-nav">
      <a routerLink="/villas" routerLinkActive="nav-active" class="nav-link">Villas</a>
      <a routerLink="/locations" routerLinkActive="nav-active" class="nav-link">Locations</a>
      <a routerLink="/terrains" routerLinkActive="nav-active" class="nav-link">Terrains</a>
    </div>

    <!-- Barre de recherche globale -->
    <app-search-bar style="flex:1;max-width:380px"></app-search-bar>

    <div class="navbar-end" style="display:flex;align-items:center;gap:8px">
      @if (auth.estConnecte()) {
        @if (auth.estAdmin()) {
          <a routerLink="/admin" routerLinkActive="nav-active" class="nav-link" style="font-size:.75rem">Admin</a>
        }
        <a routerLink="/profil" routerLinkActive="nav-active" class="nav-link" style="font-size:.78rem">
          👤 {{ auth.user()?.nom }}
        </a>
      } @else {
        <a routerLink="/login" class="nav-link" style="font-size:.8rem">Connexion</a>
        <a routerLink="/publier" class="btn-cta">Publier</a>
      }
    </div>
  </div>
</nav>

<router-outlet />

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="#C8972A"/>
        <path d="M14 6L4 13h3v9h6v-5h2v5h6V13h3L14 6z" fill="white"/>
      </svg>
      <span>MaMaison Verified</span>
    </div>
    <p class="footer-tagline">Louer, acheter, visiter et investir en confiance — Côte d'Ivoire</p>
    <p class="footer-legal">© 2026 MaMaison Verified.</p>
  </div>
</footer>
