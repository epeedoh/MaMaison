<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaMaison — Visite 3D</title>
    <script src="libs/babylon.js"></script>
    <script src="libs/babylonjs.loaders.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="viewer-container">
        <canvas id="renderCanvas"></canvas>

        <div id="ui-overlay">
            <div id="villa-info">
                <h2 id="villa-titre">Villa Démo</h2>
                <span id="villa-prix"></span>
            </div>

            <div id="navigation">
                <button id="btn-precedent" onclick="naviguerPrecedent()">← Précédent</button>
                <span id="piece-courante">Salon</span>
                <button id="btn-suivant" onclick="naviguerSuivant()">Suivant →</button>
            </div>

            <button id="btn-retour" onclick="retourFiche()">← Retour à la fiche</button>
        </div>

        <div id="hotspot-panel" class="hidden">
            <button id="hotspot-close" onclick="fermerInfo()">✕</button>
            <h3 id="hotspot-titre"></h3>
            <p id="hotspot-contenu"></p>
        </div>

        <!-- Clic pour activer -->
        <div id="click-hint" style="display:none">
            🖱️ Cliquez sur la scène pour naviguer
        </div>

        <!-- Panneau de contrôles (pointer lock actif) -->
        <div id="controls-panel" style="display:none">
            <div class="ctrl-header">
                <span class="ctrl-icon">🕹️</span>
                <span>Contrôles</span>
                <span id="esc-badge"><span class="key">Échap</span> quitter</span>
            </div>
            <div class="ctrl-grid">
                <div class="ctrl-row">
                    <div class="ctrl-keys">
                        <span class="key">W</span><span class="key">↑</span>
                    </div>
                    <span class="ctrl-label">Avancer</span>
                </div>
                <div class="ctrl-row">
                    <div class="ctrl-keys">
                        <span class="key">S</span><span class="key">↓</span>
                    </div>
                    <span class="ctrl-label">Reculer</span>
                </div>
                <div class="ctrl-row">
                    <div class="ctrl-keys">
                        <span class="key">A</span><span class="key">Q</span>
                    </div>
                    <span class="ctrl-label">Gauche</span>
                </div>
                <div class="ctrl-row">
                    <div class="ctrl-keys">
                        <span class="key">D</span><span class="key">E</span>
                    </div>
                    <span class="ctrl-label">Droite</span>
                </div>
                <div class="ctrl-row">
                    <div class="ctrl-keys">
                        <span class="key mouse-key">🖱️</span>
                    </div>
                    <span class="ctrl-label">Regarder</span>
                </div>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>Chargement de la villa...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
