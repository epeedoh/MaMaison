<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaMaison — Visite Virtuelle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="libs/babylon.js"></script>
    <script src="libs/babylonjs.loaders.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewer-container">
    <canvas id="renderCanvas"></canvas>

    <!-- ── Header ── -->
    <div id="header">
        <div id="villa-info">
            <h2 id="villa-titre">Villa Palm Beach</h2>
            <span id="villa-prix"></span>
        </div>
        <div id="piece-label">
            <span id="piece-courante">Salon</span>
        </div>
        <button id="btn-retour" onclick="retourFiche()">← Retour à la fiche</button>
    </div>

    <!-- ── Toolbar gauche (style Teia) ── -->
    <div id="toolbar">
        <button class="tool-btn" title="Vue d'ensemble" onclick="resetCamera()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline points="9,22 9,12 15,12 15,22"/>
            </svg>
        </button>
        <div class="tool-sep"></div>
        <button class="tool-btn" title="Pivoter librement" id="btnOrbit" onclick="" style="opacity:.45;cursor:default">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/>
                <path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/>
            </svg>
        </button>
        <div class="tool-sep"></div>
        <button class="tool-btn" title="Retour à la fiche" onclick="retourFiche()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>
    </div>

    <!-- ── Room selector bas (style Teia) ── -->
    <div id="room-selector"></div>

    <!-- ── Info hotspot ── -->
    <div id="hotspot-panel" class="hidden">
        <button class="hs-close" onclick="fermerInfo()">✕</button>
        <div class="hs-icon">ℹ</div>
        <h3 id="hotspot-titre"></h3>
        <p id="hotspot-contenu"></p>
    </div>

    <!-- ── Loading ── -->
    <div id="loading">
        <div class="loader-ring"></div>
        <p>Chargement de la villa…</p>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
