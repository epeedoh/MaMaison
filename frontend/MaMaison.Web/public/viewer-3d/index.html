<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242926">
  <title>MaMaison — Villa témoin</title>
  <link rel="stylesheet" href="showroom.css">
  <script type="module" src="bootstrap.js"></script>
</head>
<body data-mode="walk">
  <main id="tour" aria-label="Visite de la villa témoin">
    <canvas id="renderCanvas" tabindex="0" aria-label="Villa 3D interactive"></canvas>
    <header class="tour-header">
      <a id="back" class="icon-button" href="/villas" aria-label="Retour aux biens" title="Retour aux biens"><img src="vendor/icons/arrow-left.svg" alt=""></a>
      <div class="identity"><span class="brand">MaMaison<span class="brand-dot">.</span></span><span class="scene-kind">VILLA TÉMOIN</span></div>
      <span class="ambiance">Scène d’ambiance</span>
    </header>
    <aside class="tools" aria-label="Outils de visite">
      <button id="map-toggle" class="icon-button" aria-label="Plan de la maison" aria-controls="map-panel" aria-expanded="false" title="Plan de la maison"><img src="vendor/icons/map.svg" alt=""></button>
      <button id="reset" class="icon-button" aria-label="Revenir à l'entrée" title="Revenir à l'entrée"><img src="vendor/icons/rotate-ccw.svg" alt=""></button>
      <button id="recenter" class="icon-button" aria-label="Regarder à l'horizontale" title="Regarder à l'horizontale"><img src="vendor/icons/move.svg" alt=""></button>
      <button id="settings" class="icon-button" aria-label="Réglages" aria-controls="settings-panel" aria-expanded="false" title="Réglages"><img src="vendor/icons/sliders-horizontal.svg" alt=""></button>
      <button id="fullscreen" class="icon-button" aria-label="Plein écran" title="Plein écran"><img src="vendor/icons/maximize.svg" alt=""></button>
    </aside>
    <button id="panel-backdrop" aria-label="Fermer le panneau" hidden tabindex="-1"></button>
    <section id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-label="Réglages" hidden>
      <div class="panel-title"><h2>Réglages</h2><button id="close-settings" class="icon-button" aria-label="Fermer les réglages"><img src="vendor/icons/x.svg" alt=""></button></div>
      <label for="quality">Qualité d’image</label>
      <select id="quality"><option value="auto">Automatique</option><option value="high">Élevée</option><option value="low">Économe</option></select>
      <label for="sensitivity">Sensibilité du regard</label>
      <input id="sensitivity" type="range" min="0.5" max="2" step="0.1" value="1">
      <label for="fov">Champ de vision <output id="fov-value" for="fov">84°</output></label>
      <input id="fov" type="range" min="70" max="100" step="1" value="84">
      <label class="toggle-row" for="auto-doors">Portes automatiques<input id="auto-doors" type="checkbox" checked></label>
      <label class="toggle-row" for="invert">Inverser l’axe vertical<input id="invert" type="checkbox"></label>
      <a class="mobile-credits" href="credits.html" target="_blank" rel="noopener">Crédits 3D</a>
    </section>
    <section id="map-panel" class="map-panel" role="dialog" aria-modal="true" aria-label="Plan de la maison" hidden>
      <div class="panel-title"><h2>La maison</h2><button id="close-map" class="icon-button" aria-label="Fermer le plan"><img src="vendor/icons/x.svg" alt=""></button></div>
      <canvas id="floor-plan" width="278" height="278" aria-label="Plan avec position et orientation du visiteur"></canvas>
      <nav class="viewpoints" aria-label="Points de départ"><button data-view="0" aria-pressed="true">Jardin</button><button data-view="1" aria-pressed="false">Séjour</button><button data-view="2" aria-pressed="false">Terrasse</button></nav>
    </section>
    <div id="door-actions" hidden>
      <button id="enter-door" class="interact-button" title="Franchir la porte · E"><img src="vendor/icons/navigation.svg" alt=""><span>Passer</span></button>
      <button id="interact" class="interact-button" title="Ouvrir ou fermer"><img src="vendor/icons/door-open.svg" alt=""><span>Ouvrir</span></button>
    </div>
    <div id="room-selection" hidden><span id="selected-room"></span><button id="visit-room" class="walk-button"><img src="vendor/icons/navigation.svg" alt=""><span>Visiter</span></button></div>
    <div id="reticle" aria-hidden="true" hidden></div>
    <div class="touch-controls"><div id="joystick" role="group" aria-label="Joystick de déplacement"><span id="stick"></span></div></div>
    <div class="look-controls"><div id="look-joystick" role="group" aria-label="Joystick du regard"><span id="look-stick"><img src="vendor/icons/eye.svg" alt=""></span></div></div>
    <footer class="tour-footer">
      <div class="room-meta"><span class="overline">LA VISITE <span id="room-area"></span></span><h1 id="view-name">Le jardin</h1></div>
      <nav class="viewpoints modes" aria-label="Mode de visite">
        <button data-mode="orbit" aria-pressed="false"><img src="vendor/icons/eye.svg" alt=""><span>Extérieur 360°</span></button><button data-mode="open" aria-pressed="false"><img src="vendor/icons/map.svg" alt=""><span>Maison ouverte</span></button><button data-mode="walk" aria-pressed="true"><img src="vendor/icons/navigation.svg" alt=""><span>À pied</span></button><button id="guided-tour" aria-pressed="false"><img src="vendor/icons/play.svg" alt=""><span>Guidée</span></button>
      </nav>
      <button id="walk" class="walk-button" title="ZQSD / WASD ou flèches · Souris pour regarder · Échap pour libérer la souris"><img src="vendor/icons/navigation.svg" alt=""><span>Explorer</span></button>
    </footer>
    <a class="credits" href="credits.html" target="_blank" rel="noopener">Crédits 3D</a>
    <div id="fade" aria-hidden="true"></div>
    <div id="loading" role="status" aria-live="polite"><span class="loading-brand">MaMaison.</span><span id="loading-label">Ouverture de la villa…</span><progress id="progress" max="100" value="0"></progress><button id="retry" hidden>Réessayer</button><a href="/villas" style="color:inherit;text-decoration:underline">Retour aux annonces</a></div>
    <div id="notice" role="status" hidden></div>
  </main>
</body>
</html>
